<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Activity</title>
<style>
  :root{--bg:#14120e;--card:#1e1b16;--text:#f2ead9;--muted:#9c9284;--line:rgba(255,255,255,.1);--accent:#d94f7e;--green:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;padding:18px 14px 70px;background:radial-gradient(900px 400px at 50% -10%,#2a2233,transparent 60%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:720px;margin:auto}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:13px}
  #who{color:var(--muted);font-size:13px}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .card.other{border-color:rgba(217,79,126,.55)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;background:#5a5347}
  .dot.on{background:var(--green);animation:pulse 1.8s infinite}
  .state{display:block;font-size:13px;margin-top:2px}
  .meta{display:block;font-size:12px;color:var(--muted);margin-top:4px}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .tabs,.chips{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
  button{font:inherit;color:var(--muted);background:transparent;border:0;border-radius:9px;padding:6px 12px;cursor:pointer}
  button.on{background:var(--accent);color:#fff}
  .spacer{flex:1}
  .danger{color:#fca5a5;border:1px solid rgba(252,165,165,.35);background:transparent;font-size:13px}

  .day{margin:18px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .item{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;margin:5px 0;background:var(--card);border:1px solid var(--line);border-radius:12px}
  .item.other{border-left:3px solid var(--accent)}
  .ic{font-size:18px;line-height:1.3}
  .tx{flex:1;min-width:0;overflow-wrap:anywhere}
  .tx small{display:block;color:var(--muted);font-size:12.5px}
  .tm{color:var(--muted);font-size:12px;white-space:nowrap}
  .empty{padding:26px 10px;text-align:center;color:var(--muted)}
  #raw .item{font-size:13.5px;padding:7px 10px}

  details{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
  summary{cursor:pointer;color:var(--muted)}
  #diagOut{margin:10px 0;font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
  #testWrite{background:var(--accent);color:#fff}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>📋 Activity</h1><div class="sub">What each of you did in the chat</div></div>
    <div id="who"></div>
  </header>

  <section class="cards" id="cards"></section>

  <div class="bar">
    <div class="tabs">
      <button id="tabAct" class="on" type="button">Activity</button>
      <button id="tabRaw" type="button">Live database feed</button>
    </div>
    <div class="chips" id="chips">
      <button type="button" data-f="all" class="on">All</button>
      <button type="button" data-f="Me">Me</button>
      <button type="button" data-f="Queen">Queen</button>
    </div>
    <span class="spacer"></span>
    <button id="clearLog" class="danger" type="button">🗑 Clear activity log</button>
    <button id="clearFeed" class="danger" type="button" hidden>🗑 Clear live feed</button>
  </div>

  <section id="list"></section>
  <section id="raw" hidden></section>

  <details id="diag">
    <summary>🔧 Not showing anything? Run the checks</summary>
    <div id="diagOut">Checking…</div>
    <button id="testWrite" type="button">Write a test line</button>
  </details>
</main>

<script>
(function () {
  'use strict';

  /* ===== settings ===== */
  var CONFIG = {
    version: '10.12.0',
    users: ['Me', 'Queen'],
    logPaths: ['chatActivity', 'chatroom/_log'],     // same as chatbox-activity.js
    keep: 300,                                       // newest log lines loaded from each path
    feedKeep: 300,                                   // lines kept in the live feed (saved on this device)
    firebase: {                                      // your Firebase web config (same as the chat page)
      apiKey: "AIzaSyBCrhwDdlAVGaEFAHd7eknX0Y7ouGeXFjg",
  authDomain: "dj420-6cc63.firebaseapp.com",
  databaseURL: "https://dj420-6cc63-default-rtdb.firebaseio.com",
  projectId: "dj420-6cc63",
  storageBucket: "dj420-6cc63.firebasestorage.app",
  messagingSenderId: "473511917003",
  appId: "1:473511917003:web:3d85c1c1972b8338b1324e",
  measurementId: "G-B9WN0FHQ62"
    }
  };
  var BASE = 'https://www.gstatic.com/firebasejs/' + CONFIG.version + '/';
  var PUSH_CHARS = '-0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ_abcdefghijklmnopqrstuvwxyz';

  var PHRASE = {
    online:   ['🟢', 'came online'],
    offline:  ['⚫', 'went offline'],
    sent:     ['💬', 'sent a message'],
    edited:   ['✏️', 'edited a message'],
    deleted:  ['🗑️', 'deleted a message'],
    seen:     ['👀', 'saw the new messages'],
    typing:   ['⌨️', 'started typing'],
    settings: ['🎨', 'saved settings'],
    cleared:  ['🧹', 'cleared the chat'],
    test:     ['🧪', 'test line']
  };

  /* ===== small helpers ===== */
  function $(id) { return document.getElementById(id); }
  function noop() {}
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function timeText(ts) { return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
  function dayText(ts) {
    var d = new Date(ts), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
    if (d.toDateString() === t.toDateString()) return 'Today';
    if (d.toDateString() === y.toDateString()) return 'Yesterday';
    return d.toLocaleDateString([], { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function ago(ts) {
    if (!ts) return 'no activity yet';
    var s = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + ' min ago';
    if (s < 86400) return Math.floor(s / 3600) + ' h ago';
    return Math.floor(s / 86400) + ' d ago';
  }
  function pushTime(key) {
    var t = 0;
    for (var i = 0; i < 8; i++) {
      var n = PUSH_CHARS.indexOf(String(key).charAt(i));
      if (n < 0) return Date.now();
      t = t * 64 + n;
    }
    return t;
  }
  function preview(text) {
    var s = String(text || '');
    if (/<img\b/i.test(s)) return '📷 photo';
    s = s.replace(/^<div class="quoted">[\s\S]*?<\/div>/, '↪ ').replace(/<[^>]*>/g, '').trim();
    return s.length > 60 ? s.slice(0, 60) + '…' : s;
  }
  function isMsg(v) { return v && typeof v === 'object' && CONFIG.users.indexOf(v.user) > -1; }

  /* one log line → words */
  function describe(e) {
    var p = PHRASE[e.a] || ['•', esc(e.a || 'did something')];
    return { icon: p[0], text: '<b>' + esc(e.who || '?') + '</b> ' + p[1], detail: e.d ? esc(e.d) : '' };
  }

  /* one raw database event → words (null = too noisy / private, skipped) */
  function describeRaw(path, type, key, val) {
    if (path === 'chatroom') {
      if (isMsg(val)) {
        return { who: val.user, text: type === 'added' ? val.user + ' sent a message' : type === 'changed' ? 'a message by ' + val.user + ' was changed' : 'a message by ' + val.user + ' was deleted' };
      }
      var m = /^_(online|typing|seen|sent|draft)_(.+)$/.exec(key);
      if (m) {
        if (type === 'removed' || m[1] === 'draft') return null;            // typing drafts are never listed
        var u = m[2];
        if (m[1] === 'online') return { who: u, text: u + (val === true ? ' is online' : ' went offline') };
        if (m[1] === 'typing') return typeof val === 'number' && val > 0 ? { who: u, text: u + ' is typing' } : { who: u, text: u + ' stopped typing' };
        if (m[1] === 'seen') return { who: u, text: u + ' saw the messages' };
        if (m[1] === 'sent') return { who: u, text: u + '’s message was stored' };
      }
      if (key === '_notify') return { text: 'a notification was sent' };
      if (key === '_push') return { text: 'a device was saved for notifications' };
      return null;
    }
    if (path === 'chatSettings') return { who: key, text: key + ' saved settings' };
    if (path === 'chatPush') return { text: 'notification devices changed' };
    return null;
  }

  /* group a newest-first list under day headings */
  function byDay(items, getTs, render) {
    var html = '', day = '';
    items.forEach(function (it) {
      var dl = dayText(getTs(it));
      if (dl !== day) { day = dl; html += '<div class="day">' + esc(dl) + '</div>'; }
      html += render(it);
    });
    return html;
  }

  async function main() {
    var wanted = new URLSearchParams(window.location.search).get('user') || window.prompt('Enter your username:');
    if (CONFIG.users.indexOf(wanted) === -1) {
      document.querySelector('main').innerHTML = '<div class="empty">❌ Access denied</div>';
      return;
    }
    var me = wanted, other = me === 'Me' ? 'Queen' : 'Me';
    $('who').textContent = 'You are ' + me;

    var appMod = await import(BASE + 'firebase-app.js');
    var dbMod = await import(BASE + 'firebase-database.js');
    var app = appMod.getApps().length ? appMod.getApp() : appMod.initializeApp(CONFIG.firebase);
    var db = dbMod.getDatabase(app);
    var ref = dbMod.ref, onValue = dbMod.onValue;

    /* ===== state ===== */
    var st = {};
    CONFIG.users.forEach(function (u) { st[u] = { online: false, typing: false, messages: 0 }; });
    var entries = {};                 // every activity line, by id
    var feed = [];                    // live database feed (saved on this device)
    var FEED_KEY = 'cba_feed_' + me;
    try { feed = JSON.parse(lsGet(FEED_KEY)) || []; } catch (e) { feed = []; }
    var live = false, filter = 'all', tab = 'act';
    var diag = { connected: null, paths: {}, test: '' };

    function idFor(path, key) { return /^[sed]_/.test(key) ? key : path + '/' + key; }   // fixed-key events are stored once

    /* ===== drawing ===== */
    function allEntries() {
      return Object.keys(entries).map(function (k) { return entries[k]; });
    }
    function drawCards() {
      var last = {};
      allEntries().forEach(function (e) { if (e.who && (e.ts || 0) > (last[e.who] || 0)) last[e.who] = e.ts; });
      var html = '';
      CONFIG.users.forEach(function (u) {
        var s = st[u];
        var state = s.typing ? '⌨️ typing…' : s.online ? 'online' : 'offline';
        html += '<div class="card' + (u === other ? ' other' : '') + '">' +
          '<span class="dot' + (s.online ? ' on' : '') + '"></span><b>' + esc(u) + (u === me ? ' (you)' : '') + '</b>' +
          '<span class="state">' + state + '</span>' +
          '<span class="meta">' + s.messages + ' messages · last action ' + ago(last[u]) + '</span></div>';
      });
      $('cards').innerHTML = html;
    }

    var chipBtns = document.querySelectorAll('[data-f]');
    function drawList() {
      var all = allEntries();
      var counts = { all: all.length, Me: 0, Queen: 0 };
      all.forEach(function (e) { if (counts[e.who] !== undefined) counts[e.who]++; });
      for (var i = 0; i < chipBtns.length; i++) {
        var f = chipBtns[i].getAttribute('data-f');
        chipBtns[i].textContent = (f === 'all' ? 'All' : f) + ' (' + counts[f] + ')';
      }
      var rows = all.filter(function (e) { return filter === 'all' || e.who === filter; })
        .sort(function (a, b) { return (b.ts || 0) - (a.ts || 0); });
      if (!rows.length) {
        $('list').innerHTML = '<div class="empty">No activity to show here yet.<br>If you expected some, open <b>“Not showing anything?”</b> at the bottom.</div>';
        return;
      }
      $('list').innerHTML = byDay(rows, function (e) { return e.ts || Date.now(); }, function (e) {
        var d = describe(e);
        return '<div class="item' + (e.who === other ? ' other' : '') + '"><span class="ic">' + d.icon + '</span>' +
          '<span class="tx">' + d.text + (d.detail ? '<small>' + d.detail + '</small>' : '') + '</span>' +
          '<span class="tm">' + timeText(e.ts || Date.now()) + '</span></div>';
      });
    }

    function drawFeed() {
      if (!feed.length) { $('raw').innerHTML = '<div class="empty">Nothing yet.<br>Everything that happens in your database while this page is open is listed here and kept on this device, until you clear it.</div>'; return; }
      $('raw').innerHTML = byDay(feed, function (r) { return r.t; }, function (r) {
        return '<div class="item' + (r.who === other ? ' other' : '') + '"><span class="tx">' + esc(r.text) + '</span><span class="tm">' + timeText(r.t) + '</span></div>';
      });
    }

    function drawDiag() {
      var out = [];
      out.push('Firebase connection:  ' + (diag.connected === null ? '… checking' : diag.connected ? '✓ connected' : '✗ not connected'));
      CONFIG.logPaths.forEach(function (p) {
        var r = diag.paths[p];
        out.push(p + ':  ' + (r === undefined ? '… checking' : r === 'denied' ? '✗ cannot read (Firebase rules)' : r === 'empty' ? '✓ readable — no lines yet' : '✓ readable — has lines'));
      });
      if (diag.test) out.push('Test write:  ' + diag.test);
      var inside = diag.paths['chatroom/_log'] === 'has' && diag.paths['chatActivity'] !== 'has';
      if (inside) out.push('\nℹ️ Your log is stored inside "chatroom", so pressing Clear Chat erases it.\n   Add  "chatActivity": {".read": true, ".write": true}  to your Firebase rules to keep it safe.');
      if (CONFIG.logPaths.every(function (p) { return diag.paths[p] === 'empty'; })) out.push('\nℹ️ Both places are empty: the chat page has not recorded anything yet.\n   Check that  chatbox-activity.js  is added on the chat page (and refresh it once).');
      $('diagOut').textContent = out.join('\n');
    }

    var pending = null;
    function redraw() { if (pending) return; pending = setTimeout(function () { pending = null; drawCards(); drawList(); drawDiag(); }, 60); }

    /* ===== filters, tabs, delete buttons ===== */
    for (var c = 0; c < chipBtns.length; c++) {
      (function (b) {
        b.addEventListener('click', function () {
          filter = b.getAttribute('data-f');
          for (var j = 0; j < chipBtns.length; j++) chipBtns[j].classList.toggle('on', chipBtns[j] === b);
          drawList();
        });
      })(chipBtns[c]);
    }
    function setTab(t) {
      tab = t;
      $('tabAct').classList.toggle('on', t === 'act');
      $('tabRaw').classList.toggle('on', t === 'raw');
      $('list').hidden = t !== 'act';
      $('chips').hidden = t !== 'act';
      $('clearLog').hidden = t !== 'act';
      $('raw').hidden = t !== 'raw';
      $('clearFeed').hidden = t !== 'raw';
      if (t === 'raw') drawFeed();
    }
    $('tabAct').addEventListener('click', function () { setTab('act'); });
    $('tabRaw').addEventListener('click', function () { setTab('raw'); });

    $('clearLog').addEventListener('click', function () {                     // the saved activity log (in Firebase)
      if (!window.confirm('Clear the whole activity log for both of you?')) return;
      CONFIG.logPaths.forEach(function (p) { dbMod.remove(ref(db, p)).catch(noop); });
    });
    $('clearFeed').addEventListener('click', function () {                    // the live database feed (on this device)
      if (!window.confirm('Clear the live database feed?')) return;
      feed = [];
      lsSet(FEED_KEY, '[]');
      drawFeed();
    });

    /* ===== the saved activity log ===== */
    var countByPath = {};
    CONFIG.logPaths.forEach(function (path) {
      var q = dbMod.query(ref(db, path), dbMod.limitToLast(CONFIG.keep));
      dbMod.onChildAdded(q, function (snap) {
        var e = snap.val();
        if (!e || typeof e !== 'object' || !e.a) return;
        entries[idFor(path, snap.key)] = e;
        countByPath[path] = (countByPath[path] || 0) + 1;
        redraw();
      }, noop);
      dbMod.onChildRemoved(q, function (snap) {
        delete entries[idFor(path, snap.key)];
        redraw();
      }, noop);
    });

    /* ===== who is online / typing right now ===== */
    onValue(ref(db, '.info/connected'), function (s) { diag.connected = s.val() === true; redraw(); }, noop);
    CONFIG.users.forEach(function (u) {
      onValue(ref(db, 'chatroom/_online_' + u), function (s) { st[u].online = s.val() === true; redraw(); }, noop);
      onValue(ref(db, 'chatroom/_typing_' + u), function (s) { var v = s.val(); st[u].typing = typeof v === 'number' && v > 0; redraw(); }, noop);
    });

    /* ===== database watcher: message history, counts and the live feed ===== */
    var saveTimer = null;
    function pushFeed(path, type, key, val) {
      if (!live) return;
      var d = describeRaw(path, type, key, val);
      if (!d) return;
      feed.unshift({ t: Date.now(), who: d.who || '', text: d.text });
      if (feed.length > CONFIG.feedKeep) feed.length = CONFIG.feedKeep;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { lsSet(FEED_KEY, JSON.stringify(feed)); }, 300);
      if (tab === 'raw') drawFeed();
    }
    function watch(path) {
      var r = ref(db, path);
      dbMod.onChildAdded(r, function (s) {
        var v = s.val();
        if (path === 'chatroom' && isMsg(v)) {
          st[v.user].messages++;
          var id = 's_' + s.key;                         // past messages appear in the timeline even without a saved line
          if (!entries[id]) entries[id] = { who: v.user, a: 'sent', d: preview(v.text), ts: pushTime(s.key), derived: true };
          redraw();
        }
        pushFeed(path, 'added', s.key, v);
      }, noop);
      dbMod.onChildChanged(r, function (s) { pushFeed(path, 'changed', s.key, s.val()); }, noop);
      dbMod.onChildRemoved(r, function (s) {
        var v = s.val();
        if (path === 'chatroom' && isMsg(v)) {
          st[v.user].messages = Math.max(0, st[v.user].messages - 1);
          if (entries['s_' + s.key] && entries['s_' + s.key].derived) delete entries['s_' + s.key];
          redraw();
        }
        pushFeed(path, 'removed', s.key, v);
      }, noop);
    }
    ['chatroom', 'chatSettings', 'chatPush'].forEach(watch);
    onValue(ref(db, 'chatroom'), function () { live = true; }, noop, { onlyOnce: true });

    /* ===== checks ===== */
    function runChecks() {
      CONFIG.logPaths.forEach(function (p) {
        dbMod.get(dbMod.query(ref(db, p), dbMod.limitToLast(1))).then(function (s) {
          diag.paths[p] = s.exists() ? 'has' : 'empty';
          redraw();
        }).catch(function () { diag.paths[p] = 'denied'; redraw(); });
      });
    }
    $('testWrite').addEventListener('click', async function () {
      diag.test = 'writing…'; drawDiag();
      for (var i = 0; i < CONFIG.logPaths.length; i++) {
        try {
          await dbMod.set(dbMod.push(ref(db, CONFIG.logPaths[i])), { who: me, a: 'test', ts: dbMod.serverTimestamp() });
          diag.test = '✓ saved to ' + CONFIG.logPaths[i] + ' (you should see “🧪 test line” in the list)';
          drawDiag(); runChecks();
          return;
        } catch (e) { /* try the next path */ }
      }
      diag.test = '✗ blocked by your Firebase rules. Allow writes under "chatroom" (or add "chatActivity").';
      drawDiag();
    });
    runChecks();

    setTab('act');
    drawCards(); drawList(); drawDiag();
    setInterval(drawCards, 30000);        // keeps "5 min ago" fresh
  }

  main().catch(function (err) { console.warn('[activity]', err); });
})();
</script>
</body>
</html>
