<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💬 ChatBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBYpNCS3vUuLAyilFplDO4KTiO7ZIpfN5U",
  authDomain: "dj420-ced11.firebaseapp.com",
  projectId: "dj420-ced11",
  storageBucket: "dj420-ced11.firebasestorage.app",
  messagingSenderId: "63911511566",
  appId: "1:63911511566:web:8f92c936da406b2ec9de5f",
  measurementId: "G-5BTJE6S99C"
};
</script>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
:root{
  --bg:#14120e;--surface:#1c1912;--surface-raised:#262117;
  --hairline:rgba(201,164,105,0.22);--gold:#c9a469;--gold-soft:#e8d9b8;
  --gold-dim:#8a744c;--ink:#f2ead9;--ink-muted:#9c9284;--ink-faint:#6b6355;
  --danger:#b9563f;--radius:16px;--serif:'Fraunces',serif;--sans:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(201,164,105,.08),transparent),var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#app{height:100vh;width:100vw;position:relative}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:10px}
::selection{background:var(--gold);color:#14120e}
#chat{height:100%;width:100%;display:flex;flex-direction:column}
.chat-header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--hairline);background:linear-gradient(180deg,rgba(38,33,23,.6),transparent);backdrop-filter:blur(6px)}
.chat-header .who{display:flex;align-items:center;gap:12px}
.chat-header .avatar{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#3a3323,#201c14);border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:15px;color:var(--gold-soft)}
.chat-header .name{font-family:var(--serif);font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
.chat-header .status{font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase}
.status.online::before{content:'●';color:#7fae6f;margin-right:5px;font-size:8px}
.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--ink-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.icon-btn:hover{background:var(--surface-raised);border-color:var(--hairline);color:var(--gold)}
.icon-btn svg{width:17px;height:17px}
#messages{flex:1;overflow-y:auto;padding:26px 22px;display:flex;flex-direction:column;gap:4px}
.empty-state{margin:auto;text-align:center;color:var(--ink-faint)}
.empty-state .glyph{font-family:var(--serif);font-style:italic;font-size:28px;color:var(--gold-dim);margin-bottom:10px}
.empty-state p{font-size:13px}
.day-divider{display:flex;align-items:center;gap:12px;margin:22px 0 14px;color:var(--ink-faint);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.day-divider::before,.day-divider::after{content:'';flex:1;height:1px;background:var(--hairline)}
.day-divider .diamond{width:5px;height:5px;background:var(--gold-dim);transform:rotate(45deg);flex:none}
.row{display:flex;margin:3px 0;max-width:100%}.row.me{justify-content:flex-end}.row.rani{justify-content:flex-start}
.bubble-wrap{display:flex;align-items:center;gap:8px;max-width:74%}.row.me .bubble-wrap{flex-direction:row-reverse}
.bubble{padding:11px 15px;border-radius:16px;font-size:14.5px;line-height:1.5;position:relative;word-wrap:break-word;white-space:pre-wrap;animation:rise .3s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.row.me .bubble{background:linear-gradient(155deg,var(--gold-soft),var(--gold));color:#231a0d;border-bottom-right-radius:5px}
.row.rani .bubble{background:var(--surface-raised);border:1px solid var(--hairline);color:var(--ink);border-bottom-left-radius:5px}
.bubble .time{display:block;margin-top:4px;font-size:9.5px;letter-spacing:.04em;opacity:.55;text-align:right}
.row.rani .bubble .time{text-align:left}
.del-btn{width:26px;height:26px;border-radius:50%;border:1px solid var(--hairline);background:var(--surface);color:var(--ink-faint);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;opacity:0;transition:opacity .2s ease,color .2s ease,border-color .2s ease}
.bubble-wrap:hover .del-btn{opacity:1}.del-btn:hover{color:var(--danger);border-color:var(--danger)}.del-btn svg{width:12px;height:12px}
.composer{display:flex;align-items:flex-end;gap:12px;padding:16px 20px 20px;border-top:1px solid var(--hairline);background:linear-gradient(0deg,rgba(28,25,18,.5),transparent)}
.composer textarea{flex:1;resize:none;max-height:120px;min-height:22px;background:var(--surface);border:1px solid var(--hairline);border-radius:14px;color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;padding:12px 16px;outline:none;transition:border-color .2s ease}
.composer textarea:focus{border-color:var(--gold)}.composer textarea::placeholder{color:var(--ink-faint)}
.send-btn{width:44px;height:44px;border-radius:50%;border:none;flex:none;background:linear-gradient(155deg,var(--gold-soft),var(--gold));color:#231a0d;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.3,1.5,.5,1),filter .2s ease}
.send-btn:hover{filter:brightness(1.1);transform:scale(1.05)}.send-btn:active{transform:scale(.92)}.send-btn:disabled{opacity:.4;cursor:default;transform:none;filter:none}.send-btn svg{width:17px;height:17px;margin-left:2px}
.modal-overlay{position:fixed;inset:0;background:rgba(10,9,6,.65);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100}.modal-overlay.show{display:flex}
.modal{width:min(340px,86vw);background:linear-gradient(155deg,var(--surface-raised),var(--surface));border:1px solid var(--hairline);border-radius:var(--radius);padding:26px;text-align:center;box-shadow:0 40px 80px -30px rgba(0,0,0,.7);animation:pop .25s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
.modal .glyph{color:var(--danger);font-size:26px;margin-bottom:10px;font-family:var(--serif);font-style:italic}.modal h4{font-family:var(--serif);font-weight:500;font-size:18px;margin-bottom:8px}.modal p{font-size:12.5px;color:var(--ink-muted);line-height:1.6;margin-bottom:22px}
.modal .btn-row{display:flex;gap:10px;justify-content:center}.btn{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em;padding:10px 18px;border-radius:10px;border:1px solid var(--hairline);background:transparent;color:var(--ink-muted);cursor:pointer;transition:all .25s ease}.btn:hover{border-color:var(--gold);color:var(--ink)}
.btn.danger{background:linear-gradient(155deg,#c4664c,var(--danger));color:#fff;border:none}.btn.danger:hover{filter:brightness(1.1)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-raised);border:1px solid var(--hairline);color:var(--ink);font-size:12.5px;padding:11px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:200}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:480px){#messages{padding:20px 14px}.bubble-wrap{max-width:86%}}
</style>
</head>

<body>
<div id="app">
  <div id="chat">
    <div class="chat-header">
      <div class="who">
        <div class="avatar" id="peerAvatar">R</div>
        <div>
          <div class="name">💬 <span id="peerName">Rani</span></div>
          <div class="status online">Firebase connected</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="clearBtn" title="Clear all chats">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0-.8 12.1a2 2 0 0 1-2 1.9H7.8a2 2 0 0 1-1.9-1.9L5 7"/></svg>
        </button>
      </div>
    </div>

    <div id="messages"></div>

    <div class="composer">
      <textarea id="msgInput" placeholder="Write a message…" rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="clearModal">
    <div class="modal">
      <div class="glyph">✦</div>
      <h4>Clear all chats?</h4>
      <p>Every message in this conversation will be permanently deleted for both of you. This can't be undone.</p>
      <div class="btn-row">
        <button class="btn" id="cancelClear">Cancel</button>
        <button class="btn danger" id="confirmClear">Clear all</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
const ALLOWED_USERS = ["Me","Rani"];
const COLLECTION = "chatbox_messages";

let db = null;
let currentUser = null;
let peerUser = null;
let unsubscribeMessages = null;

const el = id => document.getElementById(id);

function toast(message){
  const t = el("toast");
  t.textContent = message;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"),2500);
}

try{
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
}catch(error){
  console.error("Firebase initialization failed:",error);
  toast("Firebase could not initialize.");
}

function askUsername(){
  let username = window.prompt(
    "Enter your username:\n\nAllowed usernames: Me or Rani"
  );

  if(username === null){
    document.body.innerHTML = `
      <div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#14120e;color:#f2ead9;font-family:Inter,sans-serif;text-align:center;padding:30px">
        <div>
          <h2 style="font-family:Fraunces,serif;font-weight:400;margin-bottom:10px">ChatBox</h2>
          <p style="color:#9c9284">Username required to enter the chat.</p>
        </div>
      </div>`;
    return;
  }

  username = username.trim();

  if(!ALLOWED_USERS.includes(username)){
    alert("Username not recognized.\n\nPlease enter Me or Rani.");
    askUsername();
    return;
  }

  currentUser = username;
  peerUser = currentUser === "Me" ? "Rani" : "Me";
  enterChat();
}

function enterChat(){
  el("peerName").textContent = peerUser;
  el("peerAvatar").textContent = peerUser.charAt(0).toUpperCase();
  listenMessages();
  el("msgInput").focus();
}

function formatTime(date){
  return date.toLocaleTimeString([],{
    hour:"2-digit",
    minute:"2-digit"
  });
}

function formatDay(date){
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate()-1);

  const sameDay = (a,b) => a.toDateString() === b.toDateString();

  if(sameDay(date,today)) return "Today";
  if(sameDay(date,yesterday)) return "Yesterday";

  return date.toLocaleDateString([],{
    month:"long",
    day:"numeric",
    year:"numeric"
  });
}

function escapeHTML(str){
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function getMessageDate(data){
  if(data.createdAt && typeof data.createdAt.toDate === "function"){
    return data.createdAt.toDate();
  }
  return new Date();
}

function renderMessages(docs){
  const container = el("messages");
  container.innerHTML = "";

  if(!docs.length){
    container.innerHTML = `
      <div class="empty-state">
        <div class="glyph">✦</div>
        <p>No messages yet — say hello.</p>
      </div>`;
    return;
  }

  let lastDay = null;

  docs.forEach(doc => {
    const data = doc.data();
    const messageDate = getMessageDate(data);
    const dayLabel = formatDay(messageDate);

    if(dayLabel !== lastDay){
      const divider = document.createElement("div");
      divider.className = "day-divider";
      divider.innerHTML = `
        <span class="diamond"></span>
        <span>${escapeHTML(dayLabel)}</span>
        <span class="diamond"></span>`;
      container.appendChild(divider);
      lastDay = dayLabel;
    }

    const isMe = data.sender === currentUser;

    const row = document.createElement("div");
    row.className = "row " + (isMe ? "me" : "rani");

    const wrap = document.createElement("div");
    wrap.className = "bubble-wrap";

    const bubble = document.createElement("div");
    bubble.className = "bubble";

    const messageText =
      typeof data.text === "string" ? data.text : "";

    bubble.innerHTML =
      escapeHTML(messageText) +
      `<span class="time">${formatTime(messageDate)}</span>`;

    const delBtn = document.createElement("button");
    delBtn.className = "del-btn";
    delBtn.title = "Delete message";

    delBtn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 7h16M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2m2 0-.8 12.1a2 2 0 0 1-2 1.9H7.8a2 2 0 0 1-1.9-1.9L5 7"/>
      </svg>`;

    delBtn.addEventListener("click",() => deleteMessage(doc.id));

    wrap.appendChild(bubble);
    wrap.appendChild(delBtn);
    row.appendChild(wrap);
    container.appendChild(row);
  });

  container.scrollTop = container.scrollHeight;
}

function listenMessages(){
  if(!db){
    toast("Firebase is not initialized.");
    return;
  }

  if(unsubscribeMessages){
    unsubscribeMessages();
    unsubscribeMessages = null;
  }

  unsubscribeMessages = db.collection(COLLECTION).onSnapshot(
    snapshot => {
      const docs = snapshot.docs.slice();

      docs.sort((a,b) => {
        const dataA = a.data();
        const dataB = b.data();

        const timeA =
          dataA.createdAt &&
          typeof dataA.createdAt.toMillis === "function"
            ? dataA.createdAt.toMillis()
            : Number.MAX_SAFE_INTEGER;

        const timeB =
          dataB.createdAt &&
          typeof dataB.createdAt.toMillis === "function"
            ? dataB.createdAt.toMillis()
            : Number.MAX_SAFE_INTEGER;

        return timeA - timeB;
      });

      renderMessages(docs);
    },
    error => {
      console.error("Firestore listener error:",error);
      toast("Could not load messages. Check Firestore Rules.");
    }
  );
}

async function sendMessage(){
  const input = el("msgInput");
  const text = input.value.trim();

  if(!text) return;

  if(!db){
    toast("Firebase is not connected.");
    return;
  }

  input.value = "";
  autoGrow(input);
  updateSendState();

  try{
    await db.collection(COLLECTION).add({
      text: text,
      sender: currentUser,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(error){
    console.error("Send message error:",error);

    input.value = text;
    autoGrow(input);
    updateSendState();

    toast("Message failed to send.");
  }
}

async function deleteMessage(id){
  if(!db) return;

  try{
    await db.collection(COLLECTION).doc(id).delete();
  }catch(error){
    console.error("Delete message error:",error);
    toast("Could not delete message.");
  }
}

async function clearAllMessages(){
  if(!db) return;

  try{
    const snapshot = await db.collection(COLLECTION).get();

    if(snapshot.empty){
      toast("There are no messages to clear.");
      return;
    }

    const batch = db.batch();

    snapshot.docs.forEach(doc => batch.delete(doc.ref));

    await batch.commit();

    toast("All messages cleared.");
  }catch(error){
    console.error("Clear messages error:",error);
    toast("Could not clear chats.");
  }
}

const input = el("msgInput");

function autoGrow(textarea){
  textarea.style.height = "auto";
  textarea.style.height =
    Math.min(textarea.scrollHeight,120) + "px";
}

function updateSendState(){
  el("sendBtn").disabled =
    input.value.trim().length === 0;
}

input.addEventListener("input",() => {
  autoGrow(input);
  updateSendState();
});

input.addEventListener("keydown",event => {
  if(event.key === "Enter" && !event.shiftKey){
    event.preventDefault();
    sendMessage();
  }
});

el("sendBtn").addEventListener("click",sendMessage);

el("clearBtn").addEventListener("click",() => {
  el("clearModal").classList.add("show");
});

el("cancelClear").addEventListener("click",() => {
  el("clearModal").classList.remove("show");
});

el("confirmClear").addEventListener("click",() => {
  el("clearModal").classList.remove("show");
  clearAllMessages();
});

askUsername();
</script>
</body>
</html>
