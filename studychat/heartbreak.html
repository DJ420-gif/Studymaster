<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Aagyi wapis kyu aayi ho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e9e7f1; --muted:#8a91a6; --hurt:#d8808f;
    --bg1:#04060b; --bg2:#0c1322;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;background:var(--bg1)}
  body{
    min-height:100vh; color:var(--ink); overflow-x:hidden;
    font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;
    background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,#070a12 100%);
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- atmosphere (fixed layers) ---------- */
  .layer{position:fixed;inset:0;pointer-events:none}
  .bokeh{z-index:0;filter:blur(34px);opacity:.9;
    background:
      radial-gradient(circle at 12% 92%, rgba(214,138,92,.20) 0 9%, transparent 10%),
      radial-gradient(circle at 30% 84%, rgba(90,160,188,.16) 0 7%, transparent 8%),
      radial-gradient(circle at 74% 90%, rgba(214,138,92,.14) 0 10%, transparent 11%),
      radial-gradient(circle at 90% 78%, rgba(216,128,143,.14) 0 8%, transparent 9%),
      radial-gradient(circle at 55% 96%, rgba(90,160,188,.12) 0 9%, transparent 10%);
    animation:drift 38s ease-in-out infinite alternate}
  @keyframes drift{from{transform:translate3d(-1.5%,0,0) scale(1)}to{transform:translate3d(1.5%,-1%,0) scale(1.05)}}
  #rain{z-index:1}
  .fog{z-index:2;opacity:.5;
    background:
      radial-gradient(60% 40% at 20% 30%, rgba(120,150,190,.07), transparent 70%),
      radial-gradient(55% 45% at 80% 70%, rgba(120,150,190,.06), transparent 70%);
    animation:fog 50s linear infinite alternate}
  @keyframes fog{from{transform:translateX(-4%)}to{transform:translateX(4%)}}
  .vignette{z-index:3;background:radial-gradient(ellipse at center, transparent 38%, rgba(0,0,0,.72) 100%)}
  .grain{z-index:4;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

  /* ---------- the story ---------- */
  main{position:relative;z-index:5}
  .scene{min-height:88vh;min-height:88svh;display:flex;align-items:center;justify-content:center;padding:14vh 8vw}
  .scene.first,.scene.last{min-height:100vh;min-height:100svh}
  .line{
    max-width:30ch;text-align:center;font-weight:300;font-style:italic;
    font-size:clamp(28px,6.2vw,50px);line-height:1.42;letter-spacing:.005em;
    opacity:.2;transition:opacity 1s ease;
    text-shadow:0 0 28px rgba(150,175,215,.18);
  }
  .line.xl{font-size:clamp(38px,9.6vw,86px);line-height:1.18;max-width:14ch}
  .line.focus{opacity:1}
  .w{display:inline-block;opacity:0;filter:blur(9px);transform:translateY(10px);
     transition:opacity 1.2s ease,filter 1.2s ease,transform 1.2s ease;transition-delay:calc(var(--i)*95ms);white-space:pre-wrap}
  .line.in .w{opacity:1;filter:blur(0);transform:none}
  .w.hurt{color:var(--hurt);font-weight:400;text-shadow:0 0 20px rgba(216,128,143,.42)}

  .hint{position:absolute;bottom:7vh;left:0;right:0;text-align:center;font:300 13px/1 system-ui,sans-serif;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);opacity:0;animation:hint 3s ease 2.6s forwards}
  @keyframes hint{0%{opacity:0;transform:translateY(-4px)}50%{opacity:.7}100%{opacity:.45;transform:translateY(4px)}}

  /* ---------- the heart ---------- */
  .final{display:flex;flex-direction:column;align-items:center;gap:6vh}
  .heart{width:clamp(96px,22vw,150px);height:auto;overflow:visible;opacity:0;transform:scale(.9);
    transition:opacity 1.4s ease, transform 1.4s ease;
    filter:drop-shadow(0 0 20px rgba(224,104,126,.5))}
  .heart.show{opacity:1;transform:none}
  .heart.beat{animation:beat 1.5s ease-in-out 2}
  @keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.09)}34%{transform:scale(.99)}52%{transform:scale(1.07)}}
  .crack{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.1s cubic-bezier(.6,.0,.3,1)}
  .heart.cracked .crack{stroke-dashoffset:0}
  .half{transition:transform 1.8s cubic-bezier(.2,.7,.2,1);transform-origin:50px 62px}
  .heart.broken{filter:drop-shadow(0 0 4px rgba(224,104,126,.12));transition:filter 2s ease}
  .heart.broken .hl{transform:translate(-5px,3px) rotate(-6deg)}
  .heart.broken .hr{transform:translate(5px,5px) rotate(7deg)}
  .heart.broken .half use{opacity:.78}

  #again{margin-top:4vh;background:none;border:0;color:var(--muted);font:300 13px system-ui,sans-serif;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;opacity:0;transition:opacity 2s ease 1s;padding:10px 14px}
  #again.show{opacity:.55}
  #again:hover{opacity:1}

  /* ---------- small controls ---------- */
  .bar{position:fixed;right:12px;top:calc(12vh);height:76vh;width:2px;background:rgba(255,255,255,.07);z-index:6;border-radius:2px}
  .bar i{display:block;width:100%;height:0;background:linear-gradient(var(--hurt),rgba(216,128,143,.2));border-radius:2px}
  #snd{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:6;background:rgba(10,14,24,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);color:var(--muted);font:300 12px system-ui,sans-serif;letter-spacing:.08em;padding:8px 12px;border-radius:20px;cursor:pointer}
  #snd[aria-pressed="true"]{color:var(--ink);border-color:rgba(216,128,143,.5)}

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    .bokeh,.fog,.heart.beat{animation:none}
    .w{transition-duration:.01s;transition-delay:0s}
  }
</style>
<noscript><style>.w{opacity:1;filter:none;transform:none}.line{opacity:1}.heart{opacity:1}</style></noscript>
</head>
<body>

<div class="layer bokeh"></div>
<canvas id="rain" class="layer" aria-hidden="true"></canvas>
<div class="layer fog"></div>
<div class="layer vignette"></div>
<div class="layer grain"></div>

<div class="bar" aria-hidden="true"><i id="fill"></i></div>
<button id="snd" type="button" aria-pressed="false">🌧 rain sound: off</button>

<main id="story"></main>

<script>
(function () {
  'use strict';

  /* ===== the words — edit them here. ['text'] pieces in brackets are shown in the dusty-rose colour ===== */
  var SCENES = [
    { cls: 'first', size: 'xl', parts: ['Aagyi wapis ', ['kyu'], ' aayi ho.'] },
    { parts: ['Bhul jaao.', ' Koi fayda ', ['nahi'], ' hai.'] },
    { parts: ['Haan, tum mujhe pasand nahi karti — pata hai mujhe.'] },
    { parts: ['Par thodi request karke bhi kehti ki ', ['dost banke reh sakte hain hum'], ' — par tumne nahi ki.'] },
    { parts: ['Theek hai.', ' Koi dikkat nahi hai.'] },
    { parts: ['Par thodi ', ['fikr'], ' to hoti hai na kisi ki… tumne wo bhi nahi dikhayi.'] },
    { parts: ['Tumne kaha ki tumhe gusse se rona aata hai. Maine gussa shant kiya — jo aaj tak nahi kiya tha, ', ['maine shant kiya'], '.'] },
    { parts: ['Tumne kaha nasha nahi karna…', ' ', ['band kar diya maine.']] },
    { parts: ['Aaj batch mein wait kar raha tha ki thodi to sochti hogi yaar, meri haal-chaal to puch hi legi — ki ', ['theek hai ya nahi'], '.'] },
    { cls: 'last', final: true, parts: ['Par ', ['kyu socha maine aisa'], '…'] }
  ];

  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  /* one line → words, each word fades in a little after the one before it */
  function buildLine(parts) {
    var i = 0, out = '';
    parts.forEach(function (p) {
      var hurt = Array.isArray(p), text = hurt ? p[0] : p;
      text.split(/\s+/).filter(Boolean).forEach(function (word) {
        out += '<span class="w' + (hurt ? ' hurt' : '') + '" style="--i:' + (i++) + '">' + esc(word) + '</span> ';
      });
    });
    return out;
  }

  var HEART =
    '<svg class="heart" viewBox="-4 -4 108 96" aria-hidden="true">' +
    '<defs>' +
    '<linearGradient id="hg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e5697f"/><stop offset="1" stop-color="#6e1a30"/></linearGradient>' +
    '<path id="hp" d="M50 85 C10 55 0 35 0 22 C0 8 12 0 25 0 C37 0 46 7 50 15 C54 7 63 0 75 0 C88 0 100 8 100 22 C100 35 90 55 50 85Z"/>' +
    '<clipPath id="cl"><polygon points="-10,-10 50,10 44,26 55,38 45,52 54,64 47,76 50,95 -10,95"/></clipPath>' +
    '<clipPath id="cr"><polygon points="110,-10 50,10 44,26 55,38 45,52 54,64 47,76 50,95 110,95"/></clipPath>' +
    '</defs>' +
    '<g class="half hl" clip-path="url(#cl)"><use href="#hp" fill="url(#hg)"/></g>' +
    '<g class="half hr" clip-path="url(#cr)"><use href="#hp" fill="url(#hg)"/></g>' +
    '<polyline class="crack" pathLength="1" points="50,10 44,26 55,38 45,52 54,64 47,76 50,88" fill="none" stroke="#04060b" stroke-width="1.7" stroke-linejoin="round"/>' +
    '</svg>';

  var story = document.getElementById('story');
  story.innerHTML = SCENES.map(function (s) {
    var line = '<p class="line' + (s.size ? ' ' + s.size : '') + '">' + buildLine(s.parts) + '</p>';
    var inner = s.final ? '<div class="final">' + HEART + line + '<button id="again" type="button">↻ phir se</button></div>' : line;
    return '<section class="scene ' + (s.cls || '') + '">' + inner + (s.cls === 'first' ? '<div class="hint">scroll</div>' : '') + '</section>';
  }).join('');

  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== a line appears when it comes into view, and the line you are reading stays bright ===== */
  var lines = story.querySelectorAll('.line');
  var heart = story.querySelector('.heart'), again = document.getElementById('again');

  function breakHeart() {
    heart.classList.add('show');
    setTimeout(function () { heart.classList.add('beat'); }, 700);
    setTimeout(function () { heart.classList.add('cracked'); }, calm ? 900 : 3900);
    setTimeout(function () { heart.classList.add('broken'); }, calm ? 1000 : 5000);
    setTimeout(function () { var l = lines[lines.length - 1]; l.classList.add('in'); }, calm ? 1200 : 5600);
    setTimeout(function () { again.classList.add('show'); }, calm ? 2000 : 9000);
  }

  if ('IntersectionObserver' in window) {
    var reveal = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        reveal.unobserve(e.target);
        if (e.target === lines[lines.length - 1]) breakHeart(); else e.target.classList.add('in');
      });
    }, { rootMargin: '0px 0px -12% 0px', threshold: 0.3 });
    var focus = new IntersectionObserver(function (es) {
      es.forEach(function (e) { e.target.classList.toggle('focus', e.isIntersecting); });
    }, { rootMargin: '-32% 0px -32% 0px' });
    lines.forEach(function (l) { reveal.observe(l); focus.observe(l); });
  } else {
    lines.forEach(function (l) { l.classList.add('in', 'focus'); });
    heart.classList.add('show', 'cracked', 'broken'); again.classList.add('show');
  }
  again.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  /* ===== progress line ===== */
  var fill = document.getElementById('fill');
  function progress() {
    var max = document.documentElement.scrollHeight - innerHeight;
    fill.style.height = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%';
  }
  addEventListener('scroll', progress, { passive: true }); progress();

  /* ===== rain on the window ===== */
  var cv = document.getElementById('rain'), cx = cv.getContext('2d'), W, H, D, drops = [];
  function make(anywhere) {
    var len = (10 + Math.random() * 26) * D;
    return { x: Math.random() * W * 1.15, y: anywhere ? Math.random() * H : -len, l: len,
             v: (9 + Math.random() * 13) * D, a: 0.07 + Math.random() * 0.2, w: (0.6 + Math.random() * 0.9) * D };
  }
  function size() {
    D = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.width = innerWidth * D; H = cv.height = innerHeight * D;
    drops = []; for (var i = 0, n = Math.min(260, Math.floor(innerWidth / 5)); i < n; i++) drops.push(make(true));
  }
  function draw() {
    cx.clearRect(0, 0, W, H); cx.lineCap = 'round';
    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      cx.strokeStyle = 'rgba(170,200,225,' + d.a + ')'; cx.lineWidth = d.w;
      cx.beginPath(); cx.moveTo(d.x, d.y); cx.lineTo(d.x - d.l * 0.18, d.y + d.l); cx.stroke();
      if (!calm) { d.y += d.v; d.x -= d.v * 0.18; if (d.y > H + d.l || d.x < -60) { drops[i] = make(false); } }
    }
    if (!calm) requestAnimationFrame(draw);
  }
  size(); draw(); addEventListener('resize', function () { size(); if (calm) draw(); });

  /* ===== optional rain sound (made in the browser, starts only when you tap) ===== */
  var snd = document.getElementById('snd'), audio = null, playing = false;
  snd.addEventListener('click', function () {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audio) {
      var ctx = new AC(), len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      var hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 700;
      var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
      var g = ctx.createGain(); g.gain.value = 0;
      src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(ctx.destination); src.start();
      audio = { ctx: ctx, gain: g };
    }
    playing = !playing;
    audio.ctx.resume();
    audio.gain.gain.linearRampToValueAtTime(playing ? 0.09 : 0, audio.ctx.currentTime + 1.4);
    snd.setAttribute('aria-pressed', String(playing));
    snd.textContent = '🌧 rain sound: ' + (playing ? 'on' : 'off');
  });
})();
</script>
</body>
</html>
